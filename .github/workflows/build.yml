name: Build ScaleX firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: 'v6.0.1'

      - name: Configure and build
        run: |
          idf.py set-target esp32c3
          idf.py -B build build

      - name: Prepare release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p release
          cp build/scalex.bin "release/scalex-${VERSION}.bin"
          mkdir -p "release/scalex-${VERSION}"
          cp build/scalex.bin "release/scalex-${VERSION}/scalex.bin"
          cp build/bootloader/bootloader.bin "release/scalex-${VERSION}/bootloader.bin"
          cp build/partition_table/partition-table.bin "release/scalex-${VERSION}/partition-table.bin"
          cp build/ota_data_initial.bin "release/scalex-${VERSION}/ota_data_initial.bin"
          cp build/scalex.elf "release/scalex-${VERSION}/scalex.elf"
          cp sdkconfig "release/scalex-${VERSION}/sdkconfig"
          (cd release && zip -j "scalex-${VERSION}.zip" "scalex-${VERSION}"/*)

      - name: Publish GitHub release with artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/scalex-${{ env.VERSION }}.bin
            release/scalex-${{ env.VERSION }}.zip

      - name: Configure AWS credentials
        if: startsWith(github.ref, 'refs/tags/')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Upload firmware to S3
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          aws s3 cp build/bootloader/bootloader.bin "s3://unixvoid-builds/scalex/${VERSION}/bootloader.bin"
          aws s3 cp build/partition_table/partition-table.bin "s3://unixvoid-builds/scalex/${VERSION}/partition-table.bin"
          aws s3 cp build/ota_data_initial.bin "s3://unixvoid-builds/scalex/${VERSION}/ota_data_initial.bin"
          aws s3 cp build/scalex.bin "s3://unixvoid-builds/scalex/${VERSION}/app.bin"
