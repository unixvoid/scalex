name: Build ScaleX firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: 'v6.0.1'

      - name: Determine build version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="0.0.1"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Project version: $VERSION"

      - name: Patch sdkconfig project version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import pathlib, re, os
          path = pathlib.Path('sdkconfig')
          text = path.read_text()
          version = os.environ['VERSION']
          if 'CONFIG_APP_PROJECT_VER=' in text:
              text = re.sub(r'CONFIG_APP_PROJECT_VER=".*"', f'CONFIG_APP_PROJECT_VER="{version}"', text)
          else:
              text = text.replace('# end of Application manager', f'CONFIG_APP_PROJECT_VER="{version}"\n# end of Application manager')
          path.write_text(text)
          PY

      - name: Configure and build
        run: |
          idf.py set-target esp32c3
          idf.py -B build -DPROJECT_VERSION=${VERSION} build

      - name: Prepare release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release
          cp build/scalex.bin "release/scalex-${VERSION}.bin"
          mkdir -p "release/scalex-${VERSION}"
          cp build/scalex.bin "release/scalex-${VERSION}/scalex.bin"
          cp build/bootloader/bootloader.bin "release/scalex-${VERSION}/bootloader.bin"
          cp build/partition_table/partition-table.bin "release/scalex-${VERSION}/partition-table.bin"
          cp build/scalex.elf "release/scalex-${VERSION}/scalex.elf"
          cp sdkconfig "release/scalex-${VERSION}/sdkconfig"
          (cd release && zip -j "scalex-${VERSION}.zip" "scalex-${VERSION}"/*)

      - name: Upload raw firmware binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: scalex-${{ env.VERSION }}
          path: release/scalex-${{ env.VERSION }}.bin

      - name: Upload firmware bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: scalex-${{ env.VERSION }}-bundle
          path: release/scalex-${{ env.VERSION }}.zip
