<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Flash ScaleX firmware directly from your browser.">
  <title>ScaleX | Firmware flasher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <h1 id="page-title">ScaleX firmware.</h1>
        <p class="lede">Connect your ScaleX device to flash new firmware or view logs.</p>
      </div>
    </section>

    <section class="flasher-panel" aria-labelledby="flash-heading">
      <label class="field">
        <span>Firmware release</span>
        <select id="releaseSelect" disabled>
          <option>Fetching GitHub releases...</option>
        </select>
      </label>

      <div class="action-row">
        <esp-web-install-button id="espInstall">
          <button class="flash-button" id="flashButton" slot="activate" type="button" disabled>
            <span class="button-icon">↗</span>
            <span>Select Device</span>
          </button>
        </esp-web-install-button>
        <a class="release-link" id="releaseLink" href="https://github.com/unixvoid/scalex/releases" target="_blank" rel="noreferrer">View release notes <span>↗</span></a>
      </div>
    </section>

    <footer class="footer">
      <span>ScaleX firmware utility</span>
      <a href="https://github.com/unixvoid/scalex" target="_blank" rel="noreferrer">github.com/unixvoid/scalex ↗</a>
    </footer>
  </main>

  <script type="module" src="https://unpkg.com/esp-web-tools@10.4.0/dist/web/install-button.js?module"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
